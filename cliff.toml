# Release notes generated from conventional commits by git-cliff.
# Preview the next release locally with: git cliff --unreleased --tag vX.Y.Z

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
{% if previous.version %}
**Full changelog**: https://github.com/Hintay/decky-rustdeck/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Only user-facing changes are listed; commits matching no parser are dropped.
filter_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
